<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ফেস হাজিরা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#12211f;--mute:#5b6b68;--line:#d5dedc;--ac:#0b6b5e;--ac2:#e3f1ee;--late:#a85a00;--bad:#b42318;--ok:#0b6b5e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a18;--card:#172522;--ink:#e8f1ef;--mute:#9db0ac;--line:#2a3d39;--ac:#3fbfa8;--ac2:#18332e;--late:#f0a850;--bad:#ff8a7a;--ok:#3fbfa8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}
nav button{white-space:nowrap}
button,input,select{font:inherit}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}
button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
main{max-width:900px;margin:0 auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>label{flex:1 1 120px;font-size:14px;color:var(--mute)}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500}
.s-ok{color:var(--ok)}.s-late{color:var(--late)}.s-abs{color:var(--bad)}
.hid{display:none}
#cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:70vh;margin:0 auto}
#v{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#msg{position:absolute;left:0;right:0;bottom:0;padding:16px;font-size:20px;font-weight:600;text-align:center;background:rgba(0,0,0,.65);color:#fff}
#msg.good{background:rgba(11,107,94,.92)}#msg.warn{background:rgba(168,90,0,.92)}#msg.bad{background:rgba(180,35,24,.92)}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
#login h1{font-size:26px;margin:0 0 4px}
.sum{display:flex;gap:10px;margin-bottom:12px}
.sum div{flex:1;background:var(--ac2);border-radius:12px;padding:10px}
.sum b{display:block;font-size:24px}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>

<div id="login">
  <h1>ফেস হাজিরা</h1>
  <p style="color:var(--mute);margin:0 0 16px">অ্যাডমিন হিসেবে লগইন করুন</p>
  <div class="card">
    <p><input id="em" type="email" placeholder="ইমেইল" autocomplete="username"></p>
    <p><input id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password"></p>
    <button class="p" id="lg" style="width:100%">লগইন</button>
    <p id="le" class="s-abs" style="margin:10px 0 0"></p>
  </div>
</div>

<div id="app" class="hid">
<header><b>ফেস হাজিরা</b><button id="out">লগআউট</button></header>
<nav id="tabs">
  <button data-t="kiosk" class="on">হাজিরা</button>
  <button data-t="emp">কর্মচারী</button>
  <button data-t="day">দৈনিক রিপোর্ট</button>
  <button data-t="his">হিস্টোরি</button>
</nav>
<main>

<section id="kiosk">
  <div class="card">
    <div id="cam"><video id="v" playsinline muted></video><div id="msg">ক্যামেরা চালু করুন</div></div>
    <div class="row" style="margin-top:10px;justify-content:center">
      <button class="p" id="go">ক্যামেরা চালু</button>
      <button id="stop" class="hid">বন্ধ করুন</button>
      <button id="snap" class="p hid">ছবি তুলুন</button>
    </div>
  </div>
</section>

<section id="emp" class="hid">
  <div class="card">
    <div class="row">
      <label>আইডি<input id="e_id"></label>
      <label>নাম<input id="e_nm"></label>
      <label>ইন টাইম<input id="e_in" type="time" value="09:00"></label>
      <label>আউট টাইম<input id="e_ot" type="time" value="17:00"></label>
      <label>রাইট টাইম (মিনিট)<input id="e_gr" type="number" min="0" value="10"></label>
      <button class="p" id="e_sv">সেভ</button>
    </div>
  </div>
  <div class="card w"><table id="et"></table></div>
</section>

<section id="day" class="hid">
  <div class="card row">
    <label>তারিখ<input id="d_dt" type="date"></label>
    <button class="p" id="d_ld">দেখুন</button>
    <button id="d_cv">CSV</button>
  </div>
  <div class="sum" id="d_sum"></div>
  <div class="card w"><table id="dt"></table></div>
</section>

<section id="his" class="hid">
  <div class="card row">
    <label>আইডি<input id="h_id"></label>
    <label>শুরু<input id="h_fr" type="date"></label>
    <label>শেষ<input id="h_to" type="date"></label>
    <button class="p" id="h_ld">দেখুন</button>
    <button id="h_cv">CSV</button>
  </div>
  <div class="sum" id="h_sum"></div>
  <div class="card w"><table id="ht"></table></div>
</section>

</main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
// ====== এখানে আপনার Firebase কনফিগ বসান ======
const CFG={apiKey:"AIzaSyD2gD_SVi5miI0XWZdXrBrJfo5cE1gUCWw",authDomain:"attendance-a21d8.firebaseapp.com",projectId:"attendance-a21d8",appId:"1:206429142800:web:56878af024a89a65b0ef95"};
// ===============================================
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
const $=s=>document.querySelector(s);
const M="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/";
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const hm=d=>p2(d.getHours())+':'+p2(d.getMinutes());
const mins=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ST={ok:['সময়মতো','s-ok'],late:['দেরি','s-late'],abs:['অনুপস্থিত','s-abs']};

let emps=[],matcher=null,stream=null,loaded=false,cur=null,enroll=null,rep={d:[],h:[]};

// ---------- লগইন ----------
$('#lg').onclick=()=>auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)
  .catch(()=>$('#le').textContent='ইমেইল বা পাসওয়ার্ড ভুল');
$('#out').onclick=()=>{stopCam();auth.signOut()};
auth.onAuthStateChanged(u=>{
  $('#login').classList.toggle('hid',!!u);$('#app').classList.toggle('hid',!u);
  if(u){$('#d_dt').value=ymd(new Date());loadEmps()}
});

// ---------- ট্যাব ----------
$('#tabs').onclick=e=>{
  const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));
  ['kiosk','emp','day','his'].forEach(x=>$('#'+x).classList.toggle('hid',x!==t));
  if(t!=='kiosk')stopCam();
  if(t==='day')loadDay();
};

// ---------- কর্মচারী ----------
async function loadEmps(){
  const s=await db.collection('emps').get();
  emps=s.docs.map(d=>d.data()).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  const L=[];
  emps.forEach(e=>{
    if(!e.faces)return;
    try{const ds=JSON.parse(e.faces).map(a=>new Float32Array(a));if(ds.length)L.push(new faceapi.LabeledFaceDescriptors(e.id,ds))}catch(_){}
  });
  matcher=null;
  if(L.length&&window.faceapi)matcher=new faceapi.FaceMatcher(L,0.45);
  $('#et').innerHTML='<tr><th>আইডি</th><th>নাম</th><th>ইন</th><th>আউট</th><th>রাইট টাইম</th><th>ফেস</th><th></th></tr>'+
    (emps.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.inTime)}</td><td>${esc(e.outTime)}</td><td>${e.grace} মি.</td>
    <td>${e.faces?'✔ আছে':'—'}</td>
    <td><button data-a="face" data-i="${esc(e.id)}">ফেস নিবন্ধন</button> <button data-a="edit" data-i="${esc(e.id)}">এডিট</button> <button data-a="del" data-i="${esc(e.id)}">মুছুন</button></td></tr>`).join('')||'<tr><td colspan=7>এখনও কেউ যোগ হয়নি। উপরে ফর্ম পূরণ করে সেভ করুন।</td></tr>');
}
$('#e_sv').onclick=async()=>{
  const id=$('#e_id').value.trim(),nm=$('#e_nm').value.trim();
  if(!id||!nm)return alert('আইডি ও নাম দিন');
  if(/[\/\s]/.test(id))return alert('আইডিতে স্পেস বা / চলবে না');
  await db.collection('emps').doc(id).set({id,name:nm,inTime:$('#e_in').value,outTime:$('#e_ot').value,grace:+$('#e_gr').value||0},{merge:true});
  ['e_id','e_nm'].forEach(x=>$('#'+x).value='');
  loadEmps();
};
$('#et').onclick=async e=>{
  const a=e.target.dataset.a,id=e.target.dataset.i;if(!a)return;
  const m=emps.find(x=>x.id===id);
  if(a==='edit'){$('#e_id').value=m.id;$('#e_nm').value=m.name;$('#e_in').value=m.inTime;$('#e_ot').value=m.outTime;$('#e_gr').value=m.grace;scrollTo(0,0)}
  if(a==='del'&&confirm(m.name+' কে মুছবেন? হাজিরার পুরনো রেকর্ড থেকে যাবে।')){await db.collection('emps').doc(id).delete();loadEmps()}
  if(a==='face'){enroll={id,n:0,ds:[]};document.querySelector('[data-t=kiosk]').click();startCam()}
};

// ---------- ক্যামেরা ও ফেস ----------
const msg=(t,c)=>{const m=$('#msg');m.textContent=t;m.className=c||''};
async function startCam(){
  try{
    msg('লোড হচ্ছে…');
    if(!loaded){await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(M),faceapi.nets.faceLandmark68Net.loadFromUri(M),faceapi.nets.faceRecognitionNet.loadFromUri(M)]);loaded=true}
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
    $('#v').srcObject=stream;await $('#v').play();
    $('#go').classList.add('hid');$('#stop').classList.remove('hid');
    $('#snap').classList.toggle('hid',!enroll);
    if(!enroll&&!matcher)return msg('আগে কর্মচারীর ফেস নিবন্ধন করুন','bad');
    tick();
  }catch(e){msg('ক্যামেরা চালু হয়নি। ব্রাউজারে ক্যামেরার অনুমতি দিন (HTTPS লাগবে)।','bad')}
}
function stopCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;enroll=null;cur=null;
  $('#go').classList.remove('hid');$('#stop').classList.add('hid');$('#snap').classList.add('hid');msg('ক্যামেরা চালু করুন');
}
$('#go').onclick=()=>{enroll=null;startCam()};
$('#stop').onclick=stopCam;
const det=()=>faceapi.detectSingleFace($('#v'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.6})).withFaceLandmarks().withFaceDescriptor();
const ear=p=>{const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);return(d(p[1],p[5])+d(p[2],p[4]))/(2*d(p[0],p[3]))};

// ফেস নিবন্ধন: ৩টি ছবি
$('#snap').onclick=async()=>{
  if(!enroll)return;
  const r=await det();
  if(!r)return msg('মুখ দেখা যাচ্ছে না, আবার চেষ্টা করুন','bad');
  enroll.ds.push(Array.from(r.descriptor));enroll.n++;
  if(enroll.n<3)return msg(`ছবি ${enroll.n}/৩ হয়েছে। মুখ সামান্য ঘুরিয়ে আবার তুলুন`,'good');
  await db.collection('emps').doc(enroll.id).update({faces:JSON.stringify(enroll.ds)});
  const n=emps.find(x=>x.id===enroll.id)?.name;
  enroll=null;await loadEmps();stopCam();alert(n+' এর ফেস নিবন্ধন সম্পন্ন');
};

// হাজিরা: মুখ চেনা + চোখের পলক (জীবন্ত যাচাই)
async function tick(){
  if(!stream)return;
  if(enroll){msg(`${enroll.id}: সোজা তাকিয়ে "ছবি তুলুন" চাপুন (${enroll.n}/৩)`);return setTimeout(tick,500)}
  try{
    // দ্রুত লুপ: শুধু চোখের অবস্থান ধরা (ভারী ফেস-চেনা ছাড়া)
    const r=await faceapi.detectSingleFace($('#v'),new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.5})).withFaceLandmarks();
    const now=Date.now();
    if(!r){cur=null;msg('ক্যামেরার সামনে আসুন')}
    else{
      const e=(ear(r.landmarks.getLeftEye())+ear(r.landmarks.getRightEye()))/2;
      if(!cur)cur={base:e,c:false,id:null,idt:0};
      cur.base=e>cur.base?e:cur.base*.98+e*.02;       // খোলা চোখের স্বাভাবিক মান
      const closed=e<cur.base*.78,open=e>cur.base*.88;
      if(closed)cur.c=true;
      if(!cur.id||(!cur.c&&now-cur.idt>2500)){          // মাঝেমধ্যে মুখ চেনা
        const f=await det();cur.idt=Date.now();
        if(f){const m=matcher.findBestMatch(f.descriptor);cur.id=m.label==='unknown'?null:m.label;cur.un=m.label==='unknown'}
      }
      if(!cur.id)msg(cur.un?'চেনা যাচ্ছে না':'চেনা হচ্ছে…',cur.un?'bad':'');
      else{
        const nm=emps.find(x=>x.id===cur.id)?.name||cur.id;
        if(cur.c&&open){                                 // পলক সম্পন্ন: আবার মিলিয়ে নিশ্চিত করা
          const f=await det(),id=f&&matcher.findBestMatch(f.descriptor).label;
          if(id===cur.id){cur=null;await mark(id);await sleep(3000)}
          else{cur=null;msg('চেনা যাচ্ছে না, আবার চেষ্টা করুন','bad')}
        }else msg(nm+' — একবার চোখের পলক ফেলুন')
      }
    }
  }catch(_){}
  setTimeout(tick,40);
}
async function mark(id){
  const e=emps.find(x=>x.id===id);if(!e)return;
  const n=new Date(),d=ymd(n),t=hm(n),ref=db.collection('att').doc(d+'_'+id),s=await ref.get();
  if(!s.exists){
    const late=mins(t)>mins(e.inTime)+e.grace;
    await ref.set({id,name:e.name,date:d,in:t,out:'',status:late?'late':'ok',lateMin:late?mins(t)-mins(e.inTime):0,ts:firebase.firestore.FieldValue.serverTimestamp()});
    msg(late?`${e.name}: ইন ${t} — ${mins(t)-mins(e.inTime)} মিনিট দেরি`:`${e.name}: ইন ${t} — সময়মতো ✔`,late?'warn':'good');
  }else{
    const a=s.data();
    if(mins(t)-mins(a.in)<30)return msg(`${e.name}: ইন ${a.in} এ আগেই হয়েছে`,'warn');
    await ref.update({out:t});msg(`${e.name}: আউট ${t} ✔`,'good');
  }
}

// ---------- রিপোর্ট ----------
function render(el,sumEl,rows,head,keys){
  const c={ok:0,late:0,abs:0};rows.forEach(r=>c[r.status]++);
  sumEl.innerHTML=`<div><b class="s-ok">${c.ok}</b>সময়মতো</div><div><b class="s-late">${c.late}</b>দেরি</div><div><b class="s-abs">${c.abs}</b>অনুপস্থিত</div>`;
  el.innerHTML='<tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr>'+
    (rows.map(r=>'<tr>'+keys.map(k=>k==='status'?`<td class="${ST[r.status][1]}">${ST[r.status][0]}${r.lateMin?` (${r.lateMin} মি.)`:''}</td>`:`<td>${esc(r[k]||'—')}</td>`).join('')+'</tr>').join('')||`<tr><td colspan=${head.length}>কোনো রেকর্ড নেই</td></tr>`);
}
async function loadDay(){
  const d=$('#d_dt').value||ymd(new Date());
  const s=await db.collection('att').where('date','==',d).get(),m={};
  s.docs.forEach(x=>m[x.data().id]=x.data());
  rep.d=emps.map(e=>m[e.id]||{id:e.id,name:e.name,date:d,in:'',out:'',status:'abs',lateMin:0});
  render($('#dt'),$('#d_sum'),rep.d,['আইডি','নাম','ইন','আউট','অবস্থা'],['id','name','in','out','status']);
}
$('#d_ld').onclick=loadDay;
$('#h_ld').onclick=async()=>{
  const id=$('#h_id').value.trim(),fr=$('#h_fr').value,to=$('#h_to').value;
  if(!id)return alert('আইডি দিন');
  const s=await db.collection('att').where('id','==',id).get();
  rep.h=s.docs.map(x=>x.data()).filter(r=>(!fr||r.date>=fr)&&(!to||r.date<=to)).sort((a,b)=>b.date.localeCompare(a.date));
  render($('#ht'),$('#h_sum'),rep.h,['তারিখ','ইন','আউট','অবস্থা'],['date','in','out','status']);
};
function csv(rows,name){
  const L=rows.map(r=>[r.date,r.id,r.name,r.in,r.out,ST[r.status][0],r.lateMin||0].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(','));
  const b=new Blob(['\ufeff'+'তারিখ,আইডি,নাম,ইন,আউট,অবস্থা,দেরি(মিনিট)\n'+L.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.csv';a.click();
}
$('#d_cv').onclick=()=>rep.d.length&&csv(rep.d,'daily-'+$('#d_dt').value);
$('#h_cv').onclick=()=>rep.h.length&&csv(rep.h,'history-'+$('#h_id').value);
</script>
</body>
</html>
